name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (real PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway credentials for an ephemeral CI container only. Not a real secret.
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ci_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://ci_user:ci_only_password@localhost:5432/ci_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123
      RUN_INTEGRATION: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install ffmpeg (PyDub decodes WebM/OGG/MP3/MP4 with it)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
        working-directory: .
      - run: pip install -r requirements-dev.txt
      - name: Run pytest (skip reasons are printed)
        run: pytest -v

  frontend:
    name: Frontend (type-check, tests, production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the template
        run: cp .env.example .env
      - name: Validate compose file
        run: docker compose config -q
      - name: Build and start the stack (waits for healthchecks)
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check API, database and Redis
        run: |
          curl -fsS http://localhost:8000/
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/health/db
          curl -fsS http://localhost:8000/health/redis
      - name: Seed the sample interview and read it back through the API
        run: |
          docker compose exec -T backend python -m app.scripts.seed_demo
          curl -fsS http://localhost:8000/api/interviews | grep -q "HireIQ Demo Interview"
      - name: Pipeline smoke test (API -> Redis -> Celery worker -> PostgreSQL; MOCK transcription)
        run: docker compose exec -T backend python -m app.scripts.smoke_pipeline
      - name: Run the demo Celery task through the real worker
        run: |
          docker compose exec -T backend python -c "from app.workers.tasks import ping; print(ping.delay('ci').get(timeout=20))"
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --no-color
      - name: Stop and clean up
        if: always()
        run: docker compose down -v
