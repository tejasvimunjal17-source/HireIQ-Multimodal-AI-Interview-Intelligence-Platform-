# Static hosting for the built HireIQ frontend (listens on 8080 as a non-root user).
# The app uses hash routing ("/#/dashboard"), so no per-route rewrites are needed; the fallback is only for direct file misses.
# add_header is kept at server level on purpose: nginx drops inherited headers in any location that defines its own.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # The interview page needs the microphone; nothing else is allowed.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    location / {
        try_files $uri /index.html;
    }
}
