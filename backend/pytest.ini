[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    integration: needs REAL PostgreSQL and Redis (set RUN_INTEGRATION=1). Skipped otherwise.
    mocked: uses a test double instead of the real service.
    static: checks repository files only (no services).
    real_api: calls a REAL paid external API (set RUN_REAL_WHISPER=1). Skipped otherwise.
